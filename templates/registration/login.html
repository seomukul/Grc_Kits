{% extends "base.html" %}
{% block title %}Log in – {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container-page max-w-md py-16">
  <div class="card p-8">
    <h1 class="text-2xl font-bold text-slate-900">Log in</h1>
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="errorlist">{{ form.non_field_errors }}</div>{% endif %}
      {% for field in form %}
      <div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
      {% endfor %}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn-primary w-full">Log in</button>
    </form>
    <p class="mt-4 text-center text-sm"><a href="{% url 'password_reset' %}" class="text-brand-600 hover:underline">Forgot password?</a></p>
  </div>
</div>
{% endblock %}
