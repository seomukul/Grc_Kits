<form hx-post="{% url 'services:inquire' service.slug %}" hx-swap="outerHTML" class="space-y-4">
  {% csrf_token %}
  {% for field in form %}
  <div>
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {{ field.errors }}
  </div>
  {% endfor %}
  <button class="btn-primary w-full">Send inquiry <span class="htmx-indicator">…</span></button>
</form>
