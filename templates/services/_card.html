<a href="{{ s.get_absolute_url }}" class="card group flex flex-col p-6 hover:border-brand-300">
  <span class="grid size-11 place-items-center rounded-xl bg-brand-50 text-brand-600">{% include "partials/_icon.html" with name=s.icon cls="size-6" %}</span>
  <h3 class="mt-4 font-semibold text-slate-900 group-hover:text-brand-700">{{ s.title }}</h3>
  <p class="mt-2 flex-1 text-sm text-slate-600">{{ s.summary }}</p>
  <p class="mt-4 text-sm font-semibold text-brand-600">{% if s.starting_price %}From ${{ s.starting_price|floatformat:0 }} · {% endif %}Learn more &rarr;</p>
</a>
