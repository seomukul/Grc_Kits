<section class="bg-slate-100/70 py-20">
  <div class="container-page">
    {% include "pages/home/_section_head.html" %}
    <div class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      {% for t in items %}
      <figure class="card flex flex-col p-6">
        <p class="text-brand-500" aria-label="{{ t.rating }} out of 5">{% for _ in "x"|rjust:t.rating %}★{% endfor %}</p>
        <blockquote class="mt-3 flex-1 text-slate-700">“{{ t.quote }}”</blockquote>
        <figcaption class="mt-4 flex items-center gap-3">
          {% if t.photo %}<img src="{{ t.photo.url }}" alt="" class="size-10 rounded-full object-cover">{% else %}<span class="grid size-10 place-items-center rounded-full bg-brand-100 font-semibold text-brand-700">{{ t.name|first }}</span>{% endif %}
          <span><span class="block font-semibold text-slate-900">{{ t.name }}</span>{% if t.role %}<span class="block text-xs text-slate-500">{{ t.role }}</span>{% endif %}</span>
        </figcaption>
      </figure>
      {% endfor %}
    </div>
  </div>
</section>
