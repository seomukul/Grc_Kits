<section class="border-y border-slate-200 bg-paper py-20">
  <div class="container-page">
    {% include "pages/home/_section_head.html" %}
    <div class="mt-10 grid gap-x-8 gap-y-8 sm:grid-cols-2 lg:grid-cols-4">
      {% for title, text in items %}
      <div class="border-t border-slate-200 pt-5">
        <span class="text-brand-600">{% include "partials/_icon.html" with name="check" cls="size-5" %}</span>
        <h3 class="mt-3 text-lg text-slate-900">{{ title }}</h3>
        <p class="mt-1 text-sm text-slate-600">{{ text }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
