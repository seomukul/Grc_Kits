<div class="flex flex-wrap items-end justify-between gap-4">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">{{ section.heading }}</h2>
    {% if section.subtitle %}<p class="mt-1 text-slate-600">{{ section.subtitle }}</p>{% endif %}
  </div>
  {% if link %}<a href="{{ link }}" class="text-sm font-semibold text-brand-600 hover:underline">{{ link_label|default:"View all" }} &rarr;</a>{% endif %}
</div>
