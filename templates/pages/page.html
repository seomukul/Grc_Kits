{% extends "base.html" %}
{% block title %}{{ page.title }} – {{ SITE_NAME }}{% endblock %}
{% block meta_description %}{{ page.meta_description }}{% endblock %}
{% block content %}
<article class="container-page max-w-3xl py-16">
  <h1 class="text-3xl font-bold text-slate-900">{{ page.title }}</h1>
  <div class="prose prose-slate mt-8 max-w-none">{{ page.body|safe }}</div>
</article>
{% endblock %}
