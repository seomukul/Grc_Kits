{% extends "base.html" %}
{% block title %}Link expired – {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container-page max-w-md py-20 text-center">
  <h1 class="text-2xl font-bold text-slate-900">This sign-in link has expired</h1>
  <p class="mt-3 text-slate-600">Sign-in links work once and only for 20 minutes.</p>
  <a href="{% url 'account:login' %}" class="btn-primary mt-8">Send a new link</a>
</div>
{% endblock %}
