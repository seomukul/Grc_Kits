{% extends "base.html" %}
{% block title %}Check your email – {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container-page max-w-md py-20 text-center">
  <div class="mx-auto grid size-14 place-items-center rounded-full bg-brand-100 text-2xl">✉</div>
  <h1 class="mt-6 text-2xl font-bold text-slate-900">Check your email</h1>
  <p class="mt-3 text-slate-600">If <strong>{{ email }}</strong> has purchases with us, a sign-in link is on its way. It works once and expires in 20 minutes.</p>
  <p class="mt-6 text-sm text-slate-500">Didn't get it? Check spam, or <a href="{% url 'account:login' %}" class="text-brand-600 hover:underline">try again</a>.</p>
</div>
{% endblock %}
