{% extends "base.html" %}
{% block title %}Sign in – {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container-page max-w-md py-16">
  <div class="card p-8">
    <h1 class="text-2xl font-bold text-slate-900">Sign in to My Library</h1>
    <p class="mt-2 text-sm text-slate-600">Enter the email you used at checkout. We'll email you a one-time sign-in link, no password needed.</p>
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div><label for="{{ form.email.id_for_label }}">{{ form.email.label }}</label>{{ form.email }}{{ form.email.errors }}</div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn-primary w-full">Email me a sign-in link</button>
    </form>
  </div>
</div>
{% endblock %}
