<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur" x-data>
  <nav class="container-page flex h-16 items-center justify-between" aria-label="Main">
    <a href="{% url 'pages:home' %}" class="flex items-center gap-2 text-lg font-bold text-brand-900">
      <span class="grid size-8 place-items-center rounded-lg bg-brand-600 text-white">G</span>
      GRCkits
    </a>

    <div class="hidden items-center gap-8 text-sm font-medium md:flex">
      <a href="{% url 'catalog:list' %}" class="hover:text-brand-600">Kits & Templates</a>
      <a href="{% url 'services:list' %}" class="hover:text-brand-600">Services</a>
      <a href="{% url 'blog:list' %}" class="hover:text-brand-600">Blog</a>
    </div>

    <div class="hidden items-center gap-3 md:flex">
      <a href="{% url 'orders:cart' %}" class="relative inline-flex items-center rounded-lg p-2 hover:bg-slate-100" aria-label="Cart"
         x-data="{ count: {{ cart_count }} }" @cart-changed.camel.window="count = $event.detail.count">
        <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/></svg>
        <span x-show="count > 0" x-text="count" class="absolute -right-1 -top-1 grid size-5 place-items-center rounded-full bg-brand-600 text-[11px] font-bold text-white">{{ cart_count }}</span>
      </a>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard:home' %}" class="btn-secondary">My Library</a>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-sm text-slate-600 hover:text-slate-900">Log out</button></form>
      {% else %}
        <a href="{% url 'account:login' %}" class="text-sm font-medium hover:text-brand-600">My Library</a>
        <a href="{% url 'catalog:list' %}" class="btn-primary">Browse kits</a>
      {% endif %}
    </div>

    <div class="flex items-center gap-1 md:hidden">
    <a href="{% url 'orders:cart' %}" class="relative inline-flex items-center rounded-lg p-2 hover:bg-slate-100" aria-label="Cart"
         x-data="{ count: {{ cart_count }} }" @cart-changed.camel.window="count = $event.detail.count">
        <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/></svg>
        <span x-show="count > 0" x-text="count" class="absolute -right-1 -top-1 grid size-5 place-items-center rounded-full bg-brand-600 text-[11px] font-bold text-white">{{ cart_count }}</span>
      </a>
    <button type="button" @click="$store.ui.mobileNav = !$store.ui.mobileNav" :aria-expanded="$store.ui.mobileNav" aria-label="Toggle menu">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    </div>
  </nav>

  <div x-cloak x-show="$store.ui.mobileNav" x-transition class="border-t border-slate-200 bg-white md:hidden">
    <div class="container-page flex flex-col gap-1 py-3 text-sm font-medium">
      <a href="{% url 'catalog:list' %}" class="rounded px-2 py-2 hover:bg-slate-100">Kits & Templates</a>
      <a href="{% url 'services:list' %}" class="rounded px-2 py-2 hover:bg-slate-100">Services</a>
      <a href="{% url 'blog:list' %}" class="rounded px-2 py-2 hover:bg-slate-100">Blog</a>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard:home' %}" class="rounded px-2 py-2 hover:bg-slate-100">My Library</a>
      {% else %}
        <a href="{% url 'account:login' %}" class="rounded px-2 py-2 hover:bg-slate-100">My Library</a>
      {% endif %}
    </div>
  </div>
</header>
