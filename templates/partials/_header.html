<header class="sticky top-0 z-40 border-b border-white/10 bg-brand-900/95 text-slate-200 backdrop-blur" x-data>
  <nav class="container-page flex h-16 items-center justify-between gap-6" aria-label="Main">
    {% include "partials/_logo.html" %}

    <div class="hidden items-center gap-7 text-sm lg:flex">
      <a href="{% url 'catalog:list' %}" class="hover:text-brand-300">Toolkits</a>
      <a href="{% url 'catalog:list' %}?type=bundle" class="hover:text-brand-300">Bundles</a>
      <a href="{% url 'services:list' %}" class="hover:text-brand-300">Services</a>
      <a href="{% url 'blog:list' %}" class="hover:text-brand-300">Blog</a>
      <a href="{% url 'pages:about' %}" class="hover:text-brand-300">About</a>
      <a href="{% url 'pages:contact' %}" class="hover:text-brand-300">Contact</a>
    </div>

    <div class="hidden items-center gap-4 lg:flex">
      {% include "partials/_cart_icon.html" %}
      <a href="{% if user.is_authenticated %}{% url 'dashboard:home' %}{% else %}{% url 'account:login' %}{% endif %}" class="text-sm hover:text-brand-300">My Library</a>
      <a href="{% url 'catalog:list' %}" class="btn-primary">Browse Toolkits</a>
    </div>

    <div class="flex items-center gap-1 lg:hidden">
      {% include "partials/_cart_icon.html" %}
      <button type="button" class="rounded p-2 hover:bg-white/10" @click="$store.ui.mobileNav = !$store.ui.mobileNav" :aria-expanded="$store.ui.mobileNav" aria-label="Toggle menu">
        <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </nav>

  <div x-cloak x-show="$store.ui.mobileNav" x-transition class="border-t border-white/10 bg-brand-900 lg:hidden">
    <div class="container-page flex flex-col gap-1 py-3 text-sm">
      <a href="{% url 'catalog:list' %}" class="rounded px-2 py-2 hover:bg-white/5">Toolkits</a>
      <a href="{% url 'catalog:list' %}?type=bundle" class="rounded px-2 py-2 hover:bg-white/5">Bundles</a>
      <a href="{% url 'services:list' %}" class="rounded px-2 py-2 hover:bg-white/5">Services</a>
      <a href="{% url 'blog:list' %}" class="rounded px-2 py-2 hover:bg-white/5">Blog</a>
      <a href="{% url 'pages:about' %}" class="rounded px-2 py-2 hover:bg-white/5">About</a>
      <a href="{% url 'pages:contact' %}" class="rounded px-2 py-2 hover:bg-white/5">Contact</a>
      <a href="{% if user.is_authenticated %}{% url 'dashboard:home' %}{% else %}{% url 'account:login' %}{% endif %}" class="rounded px-2 py-2 hover:bg-white/5">My Library</a>
      <a href="{% url 'catalog:list' %}" class="btn-primary mt-2">Browse Toolkits</a>
    </div>
  </div>
</header>
