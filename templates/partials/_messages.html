{% if messages %}
<div class="container-page mt-4 space-y-2" aria-live="polite">
  {% for message in messages %}
  <div x-data="{ open: true }" x-show="open" x-transition
       class="flex items-start justify-between rounded-lg border px-4 py-3 text-sm
              {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800{% else %}border-brand-200 bg-brand-50 text-brand-800{% endif %}">
    <span>{{ message }}</span>
    <button type="button" @click="open = false" class="ml-4 opacity-60 hover:opacity-100" aria-label="Dismiss">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
