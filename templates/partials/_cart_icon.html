<a href="{% url 'orders:cart' %}" class="relative inline-flex items-center rounded p-2 hover:text-brand-300" aria-label="Cart"
   x-data="{ count: {{ cart_count }} }" @cart-changed.camel.window="count = $event.detail.count">
  <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
  <span x-show="count > 0" x-text="count" class="absolute -right-0.5 -top-0.5 grid size-5 place-items-center rounded-full bg-brand-400 text-[11px] font-bold text-brand-950">{{ cart_count }}</span>
</a>
