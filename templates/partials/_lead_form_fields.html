{% if form.non_field_errors %}<div class="errorlist rounded-lg bg-red-50 p-3">{{ form.non_field_errors }}</div>{% endif %}
{{ form.website }}{{ form.ts }}
{% for field in form.visible_fields %}{% if field.name != "website" %}
<div>
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="font-normal text-slate-400">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
{% endif %}{% endfor %}
