<div class="mt-6 divide-y divide-slate-200 rounded-2xl border border-slate-200 bg-white">
  {% for f in faqs %}
  <details class="group p-5 [&_summary::-webkit-details-marker]:hidden">
    <summary class="flex cursor-pointer items-center justify-between gap-4 font-medium text-slate-900">
      {{ f.question }}<span class="text-slate-400 transition group-open:rotate-45">+</span>
    </summary>
    <div class="mt-3 text-sm leading-relaxed text-slate-600">{{ f.answer|linebreaksbr }}</div>
  </details>
  {% endfor %}
</div>
