{% load tz %}{% timezone tz %}<div>
  <p class="font-semibold text-slate-900">{{ day|date:"l, j F" }}</p>
  {% if times %}
  <div class="mt-3 grid max-h-80 grid-cols-[repeat(auto-fill,minmax(4.5rem,1fr))] gap-2 overflow-y-auto pr-1">
    {% for utc, local in times %}
    <button type="button" class="whitespace-nowrap rounded-sm border border-brand-500/70 bg-paper px-2 py-2 text-sm font-semibold tabular-nums text-brand-800 transition hover:bg-brand-500 hover:text-brand-950"
            hx-get="{% url 'bookings:book' %}?start={{ utc|date:'c'|urlencode }}&tz={{ tz|urlencode }}"
            hx-vals='js:{service: document.getElementById("booking-form").dataset.service}'
            hx-target="#booking-form"
            hx-on::after-request="document.getElementById('booking-form').scrollIntoView({behavior: 'smooth', block: 'start'})">
      {{ utc|time:"H:i" }}
    </button>
    {% endfor %}
  </div>
  {% else %}
  <p class="mt-2 text-sm text-slate-500">That day just filled up. Please pick another date.</p>
  {% endif %}
</div>
{% endtimezone %}
