{% if is_bestseller %}<span class="rounded-sm bg-brand-400 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-brand-950">Bestseller</span>{% endif %}
{% if is_new %}<span class="rounded-sm bg-paper/90 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-brand-900">New</span>{% endif %}
{% if is_bundle %}<span class="rounded-sm border border-brand-300/60 bg-brand-900/80 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-brand-200">Bundle</span>{% endif %}
{% if on_sale %}<span class="rounded-sm bg-rose-700 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-white">Sale</span>{% endif %}
