{% if is_bestseller %}<span class="rounded-full bg-amber-100 px-2 py-0.5 text-xs font-semibold text-amber-800">Bestseller</span>{% endif %}
{% if is_new %}<span class="rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-semibold text-emerald-800">New</span>{% endif %}
{% if is_bundle %}<span class="rounded-full bg-brand-100 px-2 py-0.5 text-xs font-semibold text-brand-800">Bundle</span>{% endif %}
{% if on_sale %}<span class="rounded-full bg-rose-100 px-2 py-0.5 text-xs font-semibold text-rose-700">Sale</span>{% endif %}
