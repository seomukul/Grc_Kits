# /etc/nginx/sites-available/grckits  (then: ln -s ../sites-available/grckits /etc/nginx/sites-enabled/)
# TLS certificates come from: certbot --nginx -d grckits.com -d www.grckits.com

upstream grckits_app {
    server unix:/run/grckits/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name grckits.com www.grckits.com;
    return 301 https://grckits.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.grckits.com;
    ssl_certificate /etc/letsencrypt/live/grckits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grckits.com/privkey.pem;
    return 301 https://grckits.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grckits.com;

    ssl_certificate /etc/letsencrypt/live/grckits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grckits.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Inquiry attachments are max 10 MB; product files go straight to R2 and never pass through here.
    client_max_body_size 20m;

    access_log /var/log/nginx/grckits.access.log;
    error_log /var/log/nginx/grckits.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /static/ {
        alias /srv/grckits/app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/grckits/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    # Never serve private files directly (paid downloads, inquiry attachments).
    location /private_media/ { return 404; }

    location / {
        proxy_pass http://grckits_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
